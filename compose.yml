# /opt/llm/compose.yml
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    deploy: { resources: { reservations: { devices: [ { capabilities: [gpu] } ] } } }
    volumes:
      - /opt/llm/models/gguf:/models:ro
    command:
      - --model
      - /models/KAT-Philly-MTP-Q4_K_M.gguf
      - --alias
      - blaskgpt
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "131072"
      - --parallel
      - "1"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --load-mode
      - none
      - --jinja
      - --no-skip-chat-parsing
      - --reasoning
      - "on"
      - --reasoning-format
      - deepseek
      - --no-context-shift
      - --flash-attn
      - auto
      - --metrics
    ports:
      - "8082:8080"
    networks:
      - llm-network
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

  llamacpp-ha:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp-ha
    deploy: { resources: { reservations: { devices: [ { capabilities: [gpu] } ] } } }
    volumes: ["/opt/llm/models/gguf:/models:ro"]
    command:
      - --model
      - /models/blaskgpt-ha.gguf
      - --alias
      - blaskgpt-ha
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --cache-ram
      - "0"
      - --n-gpu-layers
      - "24"
      - --jinja
      - --reasoning
      - "off"
      - --flash-attn
      - auto
      - --metrics
    networks:
      - llm-network
    restart: unless-stopped

  api-gateway:
    build:
      context: /opt/llm
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports: ["8080:8080"]
    volumes:
      - /opt/llm:/app
      - /opt/llm/.env:/app/.env:ro
    environment:
      - HA_URL=${HA_URL}
      - HA_ACCESS_TOKEN=${HA_ACCESS_TOKEN}
      - VLLM_URL=http://llamacpp-ha:8080
      - VLLM_API_KEY=local-dev-key
      - API_PORT=8080
      - API_HOST=0.0.0.0
    depends_on:
      - llamacpp
    networks:
      - llm-network
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

  blaskgpt:
    image: ghcr.io/open-webui/open-webui:main
    container_name: blaskgpt
    ports: ["3000:8080"]
    environment:
      - WEBUI_AUTH=True
      - WEBUI_SECRET_KEY=assumingofcourseweredealingwithfivedimensionalobjectsinabasiceuclideangeometricuniverse
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=
      - JWT_EXPIRES_IN=-1
      - OPENAI_API_BASE_URL=http://llamacpp:8080/v1
      - OPENAI_API_KEY=local-dev-key
      - OPENAI_VERIFY_SSL=false
      - CORS_ALLOW_ORIGIN=https://chat.lab.jones-family.co.uk
      - WEBUI_SESSION_COOKIE_SECURE=true
      - WEBUI_AUTH_COOKIE_SECURE=true
    volumes:
      - open-webui:/app/backend/data
    networks:
      - llm-network
    depends_on:
      - llamacpp
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      - llm-network
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY}
    volumes:
      - /opt/llm/searxng/settings.yml:/etc/searxng/settings.template.yml:ro
      - /opt/llm/searxng/entrypoint.sh:/usr/local/bin/blask-searxng-entrypoint:ro
    entrypoint:
      - /usr/local/bin/blask-searxng-entrypoint
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

  tor:
    build:
      context: ./tor
    image: llm-tor
    restart: unless-stopped
    networks:
      - llm-network

    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  llm-network:
    driver: bridge

volumes:
  open-webui:
