# /opt/llm/compose.yml
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    deploy: { resources: { reservations: { devices: [ { capabilities: [gpu] } ] } } }
    volumes: ["/opt/llm/models/gguf:/models:ro"]
    command:
      - --model
      - /models/blaskgpt.gguf
      - --alias
      - blaskgpt
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "16384"
      - --n-gpu-layers
      - "999"
      - --n-cpu-moe
      - "32"
      - --jinja
      - --flash-attn
      - auto
    ports:
      - "8082:8080"
    networks:
      - llm-network
    restart: unless-stopped

  llamacpp-ha:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp-ha
    deploy: { resources: { reservations: { devices: [ { capabilities: [gpu] } ] } } }
    volumes: ["/opt/llm/models/gguf:/models:ro"]
    command:
      - --model
      - /models/blaskgpt-ha.gguf
      - --alias
      - blaskgpt-ha
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --cache-ram
      - "0"
      - --n-gpu-layers
      - "24"
      - --jinja
      - --reasoning
      - "off"
      - --flash-attn
      - auto
    networks:
      - llm-network
    restart: unless-stopped

  api-gateway:
    build:
      context: /opt/llm
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports: ["8080:8080"]
    volumes:
      - /opt/llm:/app
      - /opt/llm/.env:/app/.env:ro
    environment:
      - HA_URL=${HA_URL}
      - HA_ACCESS_TOKEN=${HA_ACCESS_TOKEN}
      - VLLM_URL=http://llamacpp-ha:8080
      - VLLM_API_KEY=local-dev-key
      - API_PORT=8080
      - API_HOST=0.0.0.0
    depends_on:
      - llamacpp
    networks:
      - llm-network
    restart: unless-stopped

  blaskgpt:
    image: ghcr.io/open-webui/open-webui:main
    container_name: blaskgpt
    ports: ["3000:8080"]
    environment:
      - WEBUI_AUTH=True
      - WEBUI_SECRET_KEY=assumingofcourseweredealingwithfivedimensionalobjectsinabasiceuclideangeometricuniverse
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=
      - JWT_EXPIRES_IN=-1
      - OPENAI_API_BASE_URL=http://llamacpp:8080/v1
      - OPENAI_API_KEY=local-dev-key
      - OPENAI_VERIFY_SSL=false
    volumes:
      - open-webui:/app/backend/data
    networks:
      - llm-network
    depends_on:
      - llamacpp
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      - llm-network
    # Optional: expose UI to LAN for debugging
    # ports:
    #   - "8081:8080"
    volumes:
      - /opt/llm/searxng/settings.yml:/etc/searxng/settings.yml:ro

networks:
  llm-network:
    driver: bridge

volumes:
  open-webui:
