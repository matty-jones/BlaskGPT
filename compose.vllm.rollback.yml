# /opt/llm/compose.yml
services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    deploy: { resources: { reservations: { devices: [ { capabilities: [gpu] } ] } } }
    volumes: ["/opt/llm/models/hf-cache:/root/.cache/huggingface"]
    command:
      - --model
      - warshanks/Josiefied-Qwen3-4B-abliterated-v2-AWQ
      - --served-model-name
      - blaskgpt
      - --dtype
      - auto
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.80"
      - --max-num-seqs
      - "2"
      - --kv-cache-dtype
      - fp8
      - --enable-prefix-caching
      - --api-key
      - local-dev-key
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    networks:
      - llm-network
    restart: unless-stopped

  api-gateway:
    build:
      context: /opt/llm
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports: ["8080:8080"]
    volumes:
      - /opt/llm:/app
      - /opt/llm/.env:/app/.env:ro
    environment:
      - HA_URL=${HA_URL}
      - HA_ACCESS_TOKEN=${HA_ACCESS_TOKEN}
      - VLLM_URL=http://vllm:8000
      - VLLM_API_KEY=local-dev-key
      - API_PORT=8080
      - API_HOST=0.0.0.0
    depends_on:
      - vllm
    networks:
      - llm-network
    restart: unless-stopped

  blaskgpt:
    image: ghcr.io/open-webui/open-webui:main
    container_name: blaskgpt
    ports: ["3000:8080"]
    environment:
      - WEBUI_AUTH=True
      - WEBUI_SECRET_KEY=assumingofcourseweredealingwithfivedimensionalobjectsinabasiceuclideangeometricuniverse
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=
      - JWT_EXPIRES_IN=-1
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=local-dev-key
      - OPENAI_VERIFY_SSL=false
    volumes:
      - open-webui:/app/backend/data
    networks:
      - llm-network
    depends_on:
      - vllm
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      - llm-network
    # Optional: expose UI to LAN for debugging
    # ports:
    #   - "8081:8080"
    volumes:
      - /opt/llm/searxng/settings.yml:/etc/searxng/settings.yml:ro

networks:
  llm-network:
    driver: bridge

volumes:
  open-webui:
